<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptbanken – paketets steg</title>
<style>
/*PB_BASE_CSS*/
.head { display: grid; gap: 6px; justify-items: start; margin-bottom: 12px; }
.head-loading { padding: 4px 0; }
.progress-line { display: grid; gap: 4px; width: 100%; }
.progress { width: 100%; height: 4px; border-radius: 2px; background: var(--pb-border); overflow: hidden; }
.progress .fill { height: 100%; background: var(--pb-accent); }
.current-label { font-size: 1rem; }
.steps.compact, .items.compact { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.steps.compact .step { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--pb-border); border-radius: var(--pb-radius); background: var(--pb-bg); }
.steps.compact .marker { min-width: 44px; text-align: center; font-size: 12px; color: var(--pb-muted); }
.steps.compact .step.done .marker { color: #1f7a3d; }
:root[data-theme="dark"] .steps.compact .step.done .marker { color: #7dd39a; }
.steps.compact .step.current .marker { color: var(--pb-text); font-weight: 600; }
.steps.compact .label { flex: 1; min-width: 0; }
.item.compact-row { border: 1px solid var(--pb-border); border-radius: var(--pb-radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: var(--pb-bg); border: none; text-align: left; }
.row-text { display: grid; gap: 2px; flex: 1; min-width: 0; }
.row-intro { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chevron { color: var(--pb-muted); }
details > summary { cursor: pointer; color: var(--pb-muted); }
</style>
</head>
<body>
<div id="app" aria-live="polite"><p class="pb-notice">Laddar paketet …</p></div>
<script>
/*PB_BRIDGE_JS*/
</script>
<script>
(function () {
  "use strict";
  var el = PB.el;
  var app = document.getElementById("app");

  function stepLabel(prompt, index) {
    var raw = prompt.step_title || prompt.title || "Steg " + (index + 1);
    return String(raw).replace(/^\s*\d+\.\s+/, "");
  }

  function fullscreenButton() {
    if (!PB.canFullscreen()) return null;
    var full = el("button", null, "Helskärm");
    full.type = "button";
    full.addEventListener("click", function () { PB.requestFullscreen().catch(function () {}); });
    return full;
  }

  function renderNotFound() {
    var wrap = el("div", "pb-notice");
    wrap.append(el("p", null, "Paketet hittades inte."));
    var button = el("button", "pb-primary", "Visa alla paket");
    button.type = "button";
    button.addEventListener("click", function () {
      PB.sendMessage("Visa alla paket i Promptbanken.").catch(function () {});
    });
    wrap.append(button);
    app.replaceChildren(wrap);
  }

  function renderInstructionLoading(pkg) {
    var head = el("header", "head-loading");
    head.append(el("p", "pb-muted", pkg.title || pkg.slug || "Paket"));
    app.replaceChildren(head);
  }

  function renderWork(pkg, prompts, current) {
    var total = prompts.length;
    var index = current - 1;
    var currentPrompt = prompts[index];
    var nextPrompt = prompts[index + 1];
    var currentLabel = stepLabel(currentPrompt, index);

    var head = el("header", "head");
    head.append(el("strong", null, pkg.title || pkg.slug || "Paket"));
    var progressLine = el("div", "progress-line");
    progressLine.append(el("p", "pb-muted", "Steg " + current + " av " + total));
    var bar = el("div", "progress");
    bar.setAttribute("aria-hidden", "true");
    var fill = el("div", "fill");
    fill.style.width = Math.max(0, Math.min(100, Math.round((current / total) * 100))) + "%";
    bar.append(fill);
    progressLine.append(bar);
    head.append(progressLine);
    head.append(el("strong", "current-label", currentLabel));
    if (nextPrompt) head.append(el("p", "pb-muted", "Nästa: " + stepLabel(nextPrompt, index + 1)));
    var full = fullscreenButton();
    if (full) head.append(full);

    var details = el("details", null);
    details.append(el("summary", null, "Visa alla steg"));
    var list = el("ol", "steps compact");
    prompts.forEach(function (prompt, i) {
      var number = i + 1;
      var label = stepLabel(prompt, i);
      var status = number < current ? "done" : number === current ? "current" : "todo";
      var item = el("li", "step " + status);
      if (status === "current") item.setAttribute("aria-current", "step");
      var marker = el("span", "marker", status === "done" ? "✓" : status === "current" ? "pågår" : String(number));
      marker.setAttribute("aria-hidden", "true");
      item.append(marker, el("span", "label", label));
      var goTo = el("button", "pb-primary", "Gå till");
      goTo.type = "button";
      goTo.addEventListener("click", function () {
        PB.setState({ package: pkg.slug, started: number });
        PB.sendMessage("Gå till steg " + number + ' i "' + (pkg.title || pkg.slug) + '": ' + label + ".").catch(function () {});
      });
      item.append(goTo);
      list.append(item);
    });
    details.append(list);
    app.replaceChildren(head, details);
  }

  function renderExplore(pkg, prompts, type) {
    var head = el("header", "head");
    head.append(el("strong", null, pkg.title || pkg.slug || "Paket"));
    head.append(el("span", "pb-badge", type === "collection" ? "Samling · " + prompts.length + " mallar" : "Arbetsflöde · " + prompts.length + " steg"));
    var full = fullscreenButton();
    if (full) head.append(full);

    var list = el("ul", "items compact");
    prompts.forEach(function (prompt, index) {
      var number = index + 1;
      var label = type === "collection" ? (prompt.title || prompt.slug || "Mall") : stepLabel(prompt, index);
      var intro = prompt.step_intro || prompt.syfte;
      var row = el("button", "row", null);
      row.type = "button";
      var textWrap = el("span", "row-text");
      textWrap.append(el("strong", null, label));
      if (intro) textWrap.append(el("span", "pb-muted row-intro", intro));
      row.append(textWrap);
      row.append(el("span", "chevron", "›"));
      row.addEventListener("click", function () {
        PB.setState({ package: pkg.slug, started: type === "collection" ? null : number });
        var message = type === "collection"
          ? 'Använd mallen "' + label + '" från paketet "' + (pkg.title || pkg.slug) + '".'
          : 'Starta "' + (pkg.title || pkg.slug) + '" från steg ' + number + ": " + label + ".";
        PB.sendMessage(message).catch(function () {});
      });
      var item = el("li", "item compact-row");
      item.append(row);
      list.append(item);
    });
    app.replaceChildren(head, list);
  }

  PB.onData(function (data) {
    if (data && data.code === "package_not_found") { renderNotFound(); return; }
    if (!data || data.status === "error" || !Array.isArray(data.prompts) || !data.prompts.length) {
      PB.notice(app, "Kunde inte visa innehållet. Svaret finns i chatten.");
      return;
    }
    var pkg = data.package || { slug: "", title: "" };
    var prompts = data.prompts.slice().sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
    var hasPromptText = prompts.some(function (p) { return p.prompt_text; });
    if (hasPromptText) { renderInstructionLoading(pkg); return; }
    var type = pkg.package_type === "collection" ? "collection" : "workflow";
    var current = typeof data.current_step === "number" ? data.current_step : null;
    if (current !== null && type === "workflow") {
      renderWork(pkg, prompts, current);
    } else {
      renderExplore(pkg, prompts, type);
    }
  });
  PB.start(function () { PB.notice(app, "Innehållet visas i chatten."); });
})();
</script>
</body>
</html>
