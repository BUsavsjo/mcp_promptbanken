services:
  promptbanken-mcp:
    build:
      context: ./mcp-server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_LOG_LEVEL: INFO
      PROMPTBANKEN_MCP_MODE: hosted
      PROMPTBANKEN_MCP_API_KEY: ${PROMPTBANKEN_MCP_API_KEY:-}
      PROMPTBANKEN_MCP_ALLOWED_ORIGINS: ${PROMPTBANKEN_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
